<h1 class="text-3xl md:text-4xl font-black text-ads-text tracking-tight mb-10">規約の抜き書き</h1>
<p class="mb-6">社内の取り扱いに関わるところを、原文のまま貼っておく。</p>
<figure class="bg-ads-surface rounded-2xl p-8 md:p-10 mb-6">
<blockquote class="text-sm text-ads-muted space-y-4">
<p>受け取った資料は、業務のためにだけ使う。社外へ持ち出すときは、
あらかじめ管理者の許しを得る。許しを得ずに持ち出した場合は、
事故として扱い、経緯を記録に残す。</p>
</blockquote>
</figure>
<p class="mb-6">判断に迷ったら、持ち出さない側に倒す。</p>
