<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>社内ページの見本</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0 auto;
        padding: 48px 24px 96px;
        max-width: 760px;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
        line-height: 1.8;
      }
      code { background: rgba(127,127,127,.18); padding: 2px 6px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>社内ページの見本</h1>
    <p>
      このページは <code>content/internal/example/hello.html</code> です。
      会社の Google アカウントでログインした人だけが開けます。
    </p>
    <p>ログインしていないブラウザで開くと、ログイン画面に飛ばされます。</p>
    <p>
      本文をドラッグで選ぶと、その場にコメントを付けられます。右下の「コメント」から一覧も開けます。
    </p>
  </body>
</html>
