<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>公開ページの見本</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0 auto;
        padding: 48px 24px 96px;
        max-width: 760px;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
        line-height: 1.8;
      }
      code { background: rgba(127,127,127,.18); padding: 2px 6px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>公開ページの見本</h1>
    <p>
      このページは <code>content/public/hello.html</code> です。
      ログインなしで、URL を知っている人なら誰でも開けます。
    </p>
    <p>社外に渡す資料だけをここに置きます。</p>
    <p>
      本文をドラッグで選ぶと、その場にコメントを付けられます。
      はじめての方は表示する名前を 1 つだけ聞かれます（登録は要りません）。
    </p>
  </body>
</html>
